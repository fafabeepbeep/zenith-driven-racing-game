<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ZENITH DRIVEN — Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:        #0a0a0f;
  --surface:   #111118;
  --border:    #1e1e2e;
  --accent:    #e8ff00;
  --accent2:   #ff3c3c;
  --text:      #e8e8f0;
  --muted:     #6a6a82;
  --font-head: 'Bebas Neue', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --font-body: 'Inter', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body);
  min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
}

/* ── Left panel ───────────────────────────────────────── */
/* CHANGED: justify-content flex-start (was flex-end) so title sits up top.
   Padding-top reduced from 60 → 40 so the logo can breathe near the edge. */
.branding {
  position: relative; display: flex; flex-direction: column;
  justify-content: flex-start; padding: 40px 60px 30px; overflow: hidden;
  background: linear-gradient(135deg, #0d0d18 0%, #1a0a0a 100%);
}
.branding::before {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(180deg,
    transparent 0px, transparent 48px,
    rgba(232,255,0,0.04) 48px, rgba(232,255,0,0.04) 50px);
  pointer-events: none;
}
.road-art {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 300px; height: 100%;
  background: linear-gradient(180deg,
    rgba(30,30,40,0) 0%, rgba(30,30,40,0.3) 40%, rgba(30,30,40,0.7) 100%);
  clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
}
.road-art::after {
  content: ''; position: absolute; left: 50%; top: 0;
  transform: translateX(-50%); width: 6px; height: 100%;
  background: repeating-linear-gradient(180deg,
    var(--accent) 0px, var(--accent) 40px, transparent 40px, transparent 80px);
  animation: dashMove 1s linear infinite;
}
@keyframes dashMove {
  from { background-position: 0 0; }
  to   { background-position: 0 80px; }
}
.branding-content { position: relative; z-index: 1; }

/* CHANGED: bigger logo (was 64–110px clamp). */
.logo {
  font-family: var(--font-head); font-size: clamp(60px, 7vw, 110px);
  line-height: 0.9; color: var(--accent); letter-spacing: 2px;
  text-shadow: 0 0 60px rgba(232,255,0,0.3);
}
/* CHANGED: bigger tagline (was 13px). */
.tagline {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  letter-spacing: 4px; text-transform: uppercase; margin-top: 18px;
}

/* ── Leaderboard ─────────────────────────────────────── */
/* CHANGED: smaller margin-top so it sits right under the title (was 40px). */
.lb-panel { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 22px; }

/* CHANGED: bigger title (was 11px). */
.lb-title {
  font-family: var(--font-mono); font-size: 14px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
}
.lb-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

/* CHANGED: bigger row text (was 13px) and bigger rank column (was 24px). */
.lb-row {
  display: grid; grid-template-columns: 32px 1fr auto auto;
  gap: 14px; align-items: center; font-size: 16px;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  opacity: 0; animation: fadeUp 0.4s ease forwards;
  transition: transform 0.2s;
}
.lb-row.rank-1 {
  background: linear-gradient(90deg, rgba(255,215,0,0.10) 0%, transparent 100%);
  border-radius: 4px; padding: 10px 8px;
  box-shadow: inset 0 0 0 1px rgba(255,215,0,0.25), 0 0 18px rgba(255,215,0,0.08);
  transform: scale(1.02);
}
.lb-row.rank-2 {
  background: linear-gradient(90deg, rgba(170,170,170,0.08) 0%, transparent 100%);
  border-radius: 4px; padding: 9px 8px;
  box-shadow: inset 0 0 0 1px rgba(170,170,170,0.18);
}
.lb-row.rank-3 {
  background: linear-gradient(90deg, rgba(205,127,50,0.07) 0%, transparent 100%);
  border-radius: 4px; padding: 9px 8px;
  box-shadow: inset 0 0 0 1px rgba(205,127,50,0.15);
}
.lb-row:nth-child(1) { animation-delay: 0.1s; }
.lb-row:nth-child(2) { animation-delay: 0.2s; }
.lb-row:nth-child(3) { animation-delay: 0.3s; }
.lb-row:nth-child(4) { animation-delay: 0.4s; }
.lb-row:nth-child(5) { animation-delay: 0.5s; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.lb-row.rank-1 { animation-fill-mode: none; opacity: 1; transform: scale(1.02); }

/* CHANGED: bigger rank icons (were 11–13px). */
.lb-rank { font-family: var(--font-mono); color: var(--muted); font-size: 14px; }
.lb-rank.gold   { color: #ffd700; font-size: 18px; text-shadow: 0 0 10px rgba(255,215,0,0.6); }
.lb-rank.silver { color: #c0c0c0; font-size: 16px; }
.lb-rank.bronze { color: #cd7f32; font-size: 16px; }
.lb-name  { color: var(--text); font-weight: 500; }
.lb-row.rank-1 .lb-name { color: #ffd700; font-weight: 700; }
.lb-row.rank-2 .lb-name { color: #c8c8d0; font-weight: 600; }

/* CHANGED: bigger time (was 12–13px). */
.lb-time  { font-family: var(--font-mono); color: var(--accent); font-size: 15px; }
.lb-row.rank-1 .lb-time { color: #ffd700; font-size: 16px; }

.lb-badge {
  font-size: 11px; padding: 3px 8px; border-radius: 2px;
  text-transform: uppercase; letter-spacing: 1px;
}
.lb-badge.done { background: rgba(232,255,0,0.15); color: var(--accent); }
.lb-badge.unfinished { background: rgba(255,60,60,0.15); color: var(--accent2); }

/* ── View Full Leaderboard button (NEW) ───────────────── */
.lb-view-full-wrap { margin-top: 18px; text-align: center; }
.btn-view-full {
  background: transparent;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font-family: var(--font-mono); font-size: 14px; letter-spacing: 3px;
  text-transform: uppercase;
  padding: 12px 28px; border-radius: 4px;
  cursor: pointer; transition: background 0.18s, color 0.18s, transform 0.1s;
}
.btn-view-full:hover  { background: var(--accent); color: #000; }
.btn-view-full:active { transform: scale(0.97); }

/* ── Right panel ─────────────────────────────────────── */
.auth-panel {
  display: flex; flex-direction: column; justify-content: center;
  padding: 60px 70px; background: var(--surface);
  border-left: 1px solid var(--border); overflow-y: auto;
}
.tab-bar { display: flex; gap: 0; margin-bottom: 40px; border-bottom: 1px solid var(--border); }

/* CHANGED: bigger tabs (was 13px). */
.tab {
  font-family: var(--font-mono); font-size: 16px; letter-spacing: 2px;
  text-transform: uppercase; padding: 14px 0; margin-right: 36px; cursor: pointer;
  color: var(--muted); border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s; background: none;
  border-top: none; border-left: none; border-right: none; user-select: none;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* CHANGED: bigger heading (was 52px). */
.form-heading { font-family: var(--font-head); font-size: 64px; line-height: 1; margin-bottom: 32px; }
.field { margin-bottom: 22px; }

/* CHANGED: bigger label (was 11px). */
.field label {
  display: block; font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}

/* CHANGED: bigger input (was 15px). */
.field input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font-mono); font-size: 17px;
  padding: 16px 18px; border-radius: 4px; outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }

/* CHANGED: bigger submit button (was 22px / 16px padding). */
.btn-submit {
  width: 100%; margin-top: 10px; padding: 18px; background: var(--accent); color: #000;
  border: none; font-family: var(--font-head); font-size: 26px; letter-spacing: 3px;
  cursor: pointer; border-radius: 4px; transition: opacity .15s, transform .1s;
}
.btn-submit:hover  { opacity: 0.88; }
.btn-submit:active { transform: scale(0.98); }

/* CHANGED: bigger msg (was 13px). */
.msg { margin-top: 16px; font-family: var(--font-mono); font-size: 14px; padding: 12px 16px; border-radius: 4px; display: none; }
.msg.error   { background: rgba(255,60,60,0.12); color: var(--accent2); display: block; }
.msg.success { background: rgba(232,255,0,0.10); color: var(--accent);  display: block; }
.auth-form { display: none; }
.auth-form.active { display: block; }

/* ── FULL LEADERBOARD MODAL (NEW) ──────────────────────── */
.lb-modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  animation: lbFadeIn 0.25s ease;
}
.lb-modal-overlay.show { display: flex; }
@keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }

.lb-modal-box {
  width: min(900px, 96vw);
  max-height: 90vh;
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 8px;
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: lbModalPop 0.3s ease;
}
@keyframes lbModalPop {
  from { transform: scale(0.92); opacity: 0; }
  to   { transform: none;        opacity: 1; }
}
.lb-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, rgba(232,255,0,0.05), transparent);
}
.lb-modal-title {
  font-family: var(--font-head); font-size: 42px;
  color: var(--accent); letter-spacing: 3px;
}
.lb-modal-close {
  background: none; border: 1px solid var(--border);
  color: var(--text); font-family: var(--font-mono); font-size: 14px;
  padding: 8px 16px; border-radius: 4px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.lb-modal-close:hover { background: var(--border); border-color: var(--accent); }

.lb-modal-body {
  flex: 1; overflow-y: auto; padding: 16px 0;
}
.lb-table {
  width: 100%; border-collapse: collapse;
}
.lb-table th {
  position: sticky; top: 0;
  background: var(--surface);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  padding: 14px 24px; text-align: left;
  border-bottom: 1px solid var(--border);
}
.lb-table td {
  padding: 14px 24px;
  font-family: var(--font-mono); font-size: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.lb-table tr.full-rank-1 td { color: #ffd700; background: rgba(255,215,0,0.06); }
.lb-table tr.full-rank-2 td { color: #c0c0c0; background: rgba(192,192,192,0.04); }
.lb-table tr.full-rank-3 td { color: #cd7f32; background: rgba(205,127,50,0.04); }
.lb-table td.col-rank { color: var(--muted); width: 60px; }
.lb-table tr.full-rank-1 td.col-rank,
.lb-table tr.full-rank-2 td.col-rank,
.lb-table tr.full-rank-3 td.col-rank { font-size: 18px; }
.lb-table td.col-name { color: var(--text); font-weight: 500; }
.lb-table tr.full-rank-1 td.col-name { font-weight: 700; }
.lb-table td.col-time { color: var(--accent); }
.lb-table td.col-status { font-size: 12px; }
.lb-table td.col-status.done       { color: var(--accent); }
.lb-table td.col-status.unfinished { color: var(--accent2); }
.lb-table td.col-date { color: var(--muted); font-size: 13px; }

.lb-modal-footer {
  padding: 14px 32px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  text-align: center;
}

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  .branding { display: none; }
  .auth-panel { padding: 40px 30px; }
}
</style>
</head>
<body>

<section class="branding">
  <div class="road-art"></div>
  <div class="branding-content">
    <div class="logo">ZENITH<br>DRIVEN</div>
    <div class="tagline">Hand-Gesture Racing</div>

    <div class="lb-panel">
      <div class="lb-title">Live Leaderboard · Top 5</div>
      <ul class="lb-list" id="lbList">
        <li class="lb-row" style="color:var(--muted);grid-column:1/-1;font-size:14px;">Loading…</li>
      </ul>
      <div class="lb-view-full-wrap">
        <button class="btn-view-full" id="btnViewFull">View Full Leaderboard ›</button>
      </div>
    </div>
  </div>
</section>

<section class="auth-panel">
  <div class="tab-bar">
    <button class="tab active" data-tab="signin">Sign In</button>
    <button class="tab"        data-tab="signup">Sign Up</button>
  </div>

  <div class="auth-form active" id="signin">
    <div class="form-heading">Welcome<br>Back.</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="si-user" placeholder="your username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-submit" id="si-btn">START ENGINE</button>
    <div class="msg" id="si-msg"></div>
  </div>

  <div class="auth-form" id="signup">
    <div class="form-heading">Create<br>Account.</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="su-user" placeholder="choose a username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="su-pass" placeholder="min. 6 characters" autocomplete="new-password" />
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="su-conf" placeholder="repeat password" autocomplete="new-password" />
    </div>
    <button class="btn-submit" id="su-btn">JOIN THE RACE</button>
    <div class="msg" id="su-msg"></div>
  </div>
</section>

<!-- ── FULL LEADERBOARD MODAL ────────────────────────────── -->
<div class="lb-modal-overlay" id="lbFullModal">
  <div class="lb-modal-box">
    <div class="lb-modal-header">
      <div class="lb-modal-title">🏁 GLOBAL LEADERBOARD · TOP 50</div>
      <button class="lb-modal-close" id="lbModalClose">CLOSE ✕</button>
    </div>
    <div class="lb-modal-body">
      <table class="lb-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Driver</th>
            <th>Time</th>
            <th>Levels</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="lbFullBody">
          <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="lb-modal-footer">
      Top 50 records · refreshed when modal opens
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3000/api';

// ── Tab switching ─────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab, .auth-form').forEach(el => el.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// ── Sign in ───────────────────────────────────────────
document.getElementById('si-btn').addEventListener('click', async () => {
  const username = document.getElementById('si-user').value.trim();
  const password = document.getElementById('si-pass').value;
  const msg      = document.getElementById('si-msg');
  if (!username || !password) { showMsg(msg, 'error', 'Please fill in all fields.'); return; }
  try {
    const res  = await fetch(`${API}/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showMsg(msg, 'error', data.error || 'Login failed.'); return; }
    sessionStorage.setItem('token', data.token);
    sessionStorage.setItem('username', data.username);
    window.location.href = 'game.html';
  } catch {
    showMsg(msg, 'error', 'Cannot reach server. Is backend running?');
  }
});

// ── Sign up ───────────────────────────────────────────
document.getElementById('su-btn').addEventListener('click', async () => {
  const username = document.getElementById('su-user').value.trim();
  const password = document.getElementById('su-pass').value;
  const confirm  = document.getElementById('su-conf').value;
  const msg      = document.getElementById('su-msg');
  if (!username || !password) { showMsg(msg, 'error', 'Please fill in all fields.'); return; }
  if (password !== confirm)   { showMsg(msg, 'error', 'Passwords do not match.'); return; }
  try {
    const res  = await fetch(`${API}/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showMsg(msg, 'error', data.error || 'Registration failed.'); return; }
    showMsg(msg, 'success', 'Account created! Sign in to race.');
    setTimeout(() => {
      document.querySelector('[data-tab="signin"]').click();
      document.getElementById('si-user').value = username;
    }, 1500);
  } catch {
    showMsg(msg, 'error', 'Cannot reach server. Is backend running?');
  }
});

// ── Live leaderboard (top 5) ──────────────────────────
async function loadLeaderboard() {
  const list = document.getElementById('lbList');
  try {
    const res  = await fetch(`${API}/leaderboard`);
    const rows = await res.json();
    if (!rows.length) {
      list.innerHTML = '<li style="color:var(--muted);font-size:14px;grid-column:1/-1">No records yet. Be the first!</li>';
      return;
    }
    const rankClasses = ['rank-1', 'rank-2', 'rank-3'];
    const rankLabels  = ['gold',   'silver', 'bronze'];
    const rankIcons   = ['🥇', '🥈', '🥉'];
    // CHANGED: top 5 (was 8)
    list.innerHTML = rows.slice(0, 5).map((r, i) => {
      const timeStr    = r.time_completed != null ? formatTime(r.time_completed) : '—';
      const rowClass   = rankClasses[i] || '';
      const rankClass  = rankLabels[i]  || '';
      const rankIcon   = rankIcons[i]   || (i + 1).toString();
      const badgeClass = r.status === 'Completed' ? 'done' : 'unfinished';
      const badgeLabel = r.status === 'Completed' ? '✓' : 'DNF';
      return `
        <li class="lb-row ${rowClass}">
          <span class="lb-rank ${rankClass}">${rankIcon}</span>
          <span class="lb-name">${escHtml(r.username)}</span>
          <span class="lb-time">${timeStr}</span>
          <span class="lb-badge ${badgeClass}">${badgeLabel}</span>
        </li>`;
    }).join('');
  } catch {
    list.innerHTML = '<li style="color:var(--muted);font-size:14px;grid-column:1/-1">Could not load leaderboard.</li>';
  }
}

// ── Full leaderboard modal (top 50) ──────────────────
const lbModal      = document.getElementById('lbFullModal');
const lbModalBody  = document.getElementById('lbFullBody');
const lbModalClose = document.getElementById('lbModalClose');
const btnViewFull  = document.getElementById('btnViewFull');

async function loadFullLeaderboard() {
  lbModalBody.innerHTML =
    '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">Loading…</td></tr>';

  try {
    const res  = await fetch(`${API}/leaderboard/full`);
    const rows = await res.json();

    if (!rows.length) {
      lbModalBody.innerHTML =
        '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No records yet. Be the first!</td></tr>';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    lbModalBody.innerHTML = rows.map((r, i) => {
      const rankCls = i < 3 ? `full-rank-${i + 1}` : '';
      const rank    = i < 3 ? medals[i] : '#' + (i + 1);
      const time    = r.time_completed != null ? formatTime(r.time_completed) : '—';
      const stCls   = r.status === 'Completed' ? 'done' : 'unfinished';
      const stTxt   = r.status === 'Completed' ? '✓ Done' : 'DNF';
      const date    = r.date || '—';
      return `
        <tr class="${rankCls}">
          <td class="col-rank">${rank}</td>
          <td class="col-name">${escHtml(r.username)}</td>
          <td class="col-time">${time}</td>
          <td>${r.levels_completed}</td>
          <td class="col-status ${stCls}">${stTxt}</td>
          <td class="col-date">${date}</td>
        </tr>`;
    }).join('');

  } catch (e) {
    lbModalBody.innerHTML =
      '<tr><td colspan="6" style="text-align:center;color:var(--accent2);padding:30px;">Could not load leaderboard.</td></tr>';
  }
}

btnViewFull.addEventListener('click', () => {
  lbModal.classList.add('show');
  loadFullLeaderboard();
});
lbModalClose.addEventListener('click', () => lbModal.classList.remove('show'));
lbModal.addEventListener('click', (e) => {
  // Close when clicking outside the box
  if (e.target === lbModal) lbModal.classList.remove('show');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lbModal.classList.contains('show'))
    lbModal.classList.remove('show');
});

// ── Helpers ───────────────────────────────────────────
function formatTime(secs) {
  const m = Math.floor(secs / 60).toString().padStart(2, '0');
  const s = (secs % 60).toFixed(1).padStart(4, '0');
  return `${m}:${s}`;
}
function escHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showMsg(el, type, text) { el.className = 'msg ' + type; el.textContent = text; }

// Initial load + auto-refresh every 30s
loadLeaderboard();
setInterval(loadLeaderboard, 30_000);

// Enter key on auth forms
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (lbModal.classList.contains('show')) return; // ignore Enter inside modal
  const active = document.querySelector('.auth-form.active');
  if (active?.id === 'signin') document.getElementById('si-btn').click();
  if (active?.id === 'signup') document.getElementById('su-btn').click();
});
</script>
